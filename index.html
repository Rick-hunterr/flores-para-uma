<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#26361f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<title>Para Uma 💐</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Pantalla de regalo -->
  <div id="gift-screen" class="screen">
    <div class="sparkles" aria-hidden="true"></div>
    <h1 class="gift-title">Para Uma</h1>
    <button id="gift-box" class="gift-box" aria-label="Abrir regalo">
      <svg viewBox="0 0 100 100" class="gift-svg">
        <rect class="box-body" x="14" y="42" width="72" height="46" rx="4"/>
        <rect class="box-lid" x="10" y="30" width="80" height="16" rx="4"/>
        <rect class="ribbon-v" x="45" y="30" width="10" height="58"/>
        <rect class="ribbon-h" x="10" y="38" width="80" height="10"/>
        <path class="bow" d="M50 30 C40 14, 20 16, 26 28 C30 34, 44 32, 50 30 C56 32, 70 34, 74 28 C80 16, 60 14, 50 30 Z"/>
      </svg>
    </button>
    <p class="gift-hint">Tocá el regalo para abrirlo</p>
  </div>

  <!-- Pantalla: girá el teléfono -->
  <div id="rotate-screen" class="screen hidden">
    <svg viewBox="0 0 100 100" class="rotate-svg" aria-hidden="true">
      <rect x="30" y="10" width="40" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="5"/>
      <circle cx="50" cy="72" r="2.5" fill="currentColor"/>
      <path d="M78 40 A28 28 0 1 1 62 15" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path d="M62 8 L62 18 L72 16 Z" fill="currentColor"/>
    </svg>
    <p>Girá tu teléfono para continuar</p>
  </div>

  <!-- Escena principal: overworld -->
  <div id="game-screen" class="screen hidden">

    <div class="map" id="map">
      <div class="deco tree t1" aria-hidden="true"></div>
      <div class="deco tree t2" aria-hidden="true"></div>
      <div class="deco tree t3" aria-hidden="true"></div>
      <div class="deco tree t4" aria-hidden="true"></div>
      <div class="deco tree t5" aria-hidden="true"></div>
      <div class="deco tree t6" aria-hidden="true"></div>
      <div class="deco bush b1" aria-hidden="true"></div>
      <div class="deco bush b2" aria-hidden="true"></div>
      <div class="deco flowerpatch f1" aria-hidden="true"></div>
      <div class="deco flowerpatch f2" aria-hidden="true"></div>

      <div id="pablo" class="character">
        <div class="shadow"></div>
        <div class="sprite pablo-sprite"></div>
      </div>

      <div id="uma" class="character">
        <div class="shadow"></div>
        <div class="sprite uma-sprite"></div>
      </div>

      <div id="flower-fx" class="flower-fx" aria-hidden="true">💐</div>
    </div>

    <div class="hint" id="hint">Acercate a Pablo</div>

    <div id="dpad" class="dpad" aria-hidden="false">
      <button class="dpad-btn up" data-dir="up" aria-label="Arriba">▲</button>
      <button class="dpad-btn left" data-dir="left" aria-label="Izquierda">◀</button>
      <button class="dpad-btn right" data-dir="right" aria-label="Derecha">▶</button>
      <button class="dpad-btn down" data-dir="down" aria-label="Abajo">▼</button>
      <div class="dpad-center" aria-hidden="true"></div>
    </div>

    <button id="mute-btn" class="mute-btn" aria-label="Silenciar música">🔊</button>

    <!-- Cuadro de diálogo estilo retro -->
    <div id="dialog-box" class="dialog-box hidden">
      <div class="dialog-frame">
        <p id="dialog-text" class="dialog-text"></p>
        <span id="dialog-arrow" class="dialog-arrow hidden">▼</span>
      </div>
    </div>
  </div>

  <audio id="music-map" src="assets/audio/cancion_nes_instrumental.ogg" loop preload="auto"></audio>
  <audio id="music-flowers" src="assets/audio/flores_amarillas.ogg" loop preload="auto"></audio>

  <script src="js/main.js"></script>
</body>
</html>
