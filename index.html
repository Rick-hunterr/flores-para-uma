<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#26361f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💐</text></svg>">

<meta property="og:type" content="website">
<meta property="og:title" content="Para Uma 🌼">
<meta property="og:description" content="Un pequeño juego y una carta para Uma.">
<meta property="og:url" content="https://rick-hunterr.github.io/flores-para-uma/">
<meta property="og:image" content="https://rick-hunterr.github.io/flores-para-uma/assets/images/og-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Para Uma 🌼">
<meta name="twitter:description" content="Un pequeño juego y una carta para Uma.">
<meta name="twitter:image" content="https://rick-hunterr.github.io/flores-para-uma/assets/images/og-preview.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<title>Para Uma 💐</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Pantalla de regalo (primer gesto del usuario: desbloquea audio/fullscreen) -->
  <div id="gift-screen" class="screen">
    <div class="sparkles" aria-hidden="true"></div>
    <h1 class="gift-title">Para Uma</h1>
    <button id="gift-box" class="gift-box" aria-label="Abrir regalo">
      <svg viewBox="0 0 100 100" class="gift-svg">
        <rect class="box-body" x="14" y="42" width="72" height="46" rx="4"/>
        <rect class="box-lid" x="10" y="30" width="80" height="16" rx="4"/>
        <rect class="ribbon-v" x="45" y="30" width="10" height="58"/>
        <rect class="ribbon-h" x="10" y="38" width="80" height="10"/>
        <path class="bow" d="M50 30 C40 14, 20 16, 26 28 C30 34, 44 32, 50 30 C56 32, 70 34, 74 28 C80 16, 60 14, 50 30 Z"/>
      </svg>
    </button>
    <p class="gift-hint">Tocá el regalo para abrirlo</p>
  </div>

  <!-- Pantalla: girá el telefono (gate de orientacion en portrait) -->
  <div id="rotate-screen" class="screen hidden">
    <svg viewBox="0 0 100 100" class="rotate-svg" aria-hidden="true">
      <rect x="30" y="10" width="40" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="5"/>
      <circle cx="50" cy="72" r="2.5" fill="currentColor"/>
      <path d="M78 40 A28 28 0 1 1 62 15" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path d="M62 8 L62 18 L72 16 Z" fill="currentColor"/>
    </svg>
    <p>Girá tu teléfono para continuar</p>
  </div>

  <!-- Menu principal: Jugar / Opciones -->
  <div id="start-screen" class="screen hidden">
    <h1 class="menu-title">Para Uma</h1>
    <p class="menu-subtitle">un pequeño paseo por el bosque</p>
    <div class="menu-buttons">
      <button id="play-btn" class="menu-btn primary">Jugar</button>
      <button id="options-btn" class="menu-btn">Opciones</button>
      <button id="rewatch-btn" class="menu-btn hidden">Ver el final</button>
    </div>
  </div>

  <!-- Opciones: volumen -->
  <div id="options-screen" class="screen hidden">
    <h2 class="menu-title small">Opciones</h2>
    <label class="volume-row" for="volume-slider">
      <span>🎵 Música</span>
      <input type="range" id="volume-slider" min="0" max="100" value="70">
    </label>
    <button id="options-back-btn" class="menu-btn">Volver</button>
  </div>

  <!-- Escena principal: overworld con camara -->
  <div id="game-screen" class="screen hidden">

    <div class="camera" id="camera">
      <div class="world" id="world">
        <div class="world-bg"></div>
        <!-- la decoracion (arboles, arbustos, flores, rocas, camino) se genera por JS -->
        <div id="decor-layer"></div>
        <!-- luciernagas en espacio de mundo (para poder agruparlas cerca de Pablo) -->
        <div id="world-ambient" aria-hidden="true"></div>

        <div id="pablo" class="character">
          <div class="shadow"></div>
          <div class="sprite pablo-sprite"></div>
        </div>

        <div id="uma" class="character">
          <div class="shadow"></div>
          <div class="sprite uma-sprite"></div>
        </div>

        <button id="flower-fx" class="flower-fx" aria-hidden="true" tabindex="-1">
          <img src="assets/images/girasolpixel.png" alt="Recibir las flores">
        </button>
      </div>
    </div>

    <!-- efectos ambientales: luciernagas y hojas, en capa fija (no se mueve con la camara) -->
    <div class="ambient" id="ambient" aria-hidden="true"></div>
    <div class="tint-overlay" id="tint-overlay" aria-hidden="true"></div>
    <div class="vignette-overlay" aria-hidden="true"></div>

    <p class="hint" id="hint">Acercate a Pablo</p>
    <div class="offscreen-indicator hidden" id="offscreen-indicator" aria-hidden="true">▲</div>

    <div id="dpad" class="dpad">
      <button class="dpad-btn up" data-dir="up" aria-label="Arriba">▲</button>
      <button class="dpad-btn left" data-dir="left" aria-label="Izquierda">◀</button>
      <button class="dpad-btn right" data-dir="right" aria-label="Derecha">▶</button>
      <button class="dpad-btn down" data-dir="down" aria-label="Abajo">▼</button>
      <div class="dpad-center" aria-hidden="true"></div>
    </div>

    <button id="mute-btn" class="mute-btn" aria-label="Silenciar música">🔊</button>

    <button id="talk-btn" class="talk-btn hidden">💬 Hablar</button>

    <!-- Cuadro de dialogo estilo RPG retro -->
    <div id="dialog-box" class="dialog-box hidden">
      <div class="dialog-frame">
        <p id="dialog-speaker" class="dialog-speaker"></p>
        <p id="dialog-text" class="dialog-text"></p>
        <span id="dialog-arrow" class="dialog-arrow hidden">▼</span>
      </div>
    </div>

    <!-- Momento especial: flor + corazon al entregar las flores -->
    <div id="special-moment" class="special-moment hidden" aria-hidden="true">
      <div class="special-content">
        <img class="special-flower" src="assets/images/girasolpixel.png" alt="">
        <div class="special-heart"></div>
      </div>
    </div>
  </div>

  <!-- Pantalla final: wallpaper descargable -->
  <div id="final-screen" class="screen hidden">
    <h2 class="menu-title small">💐</h2>
    <div class="wallpaper-tabs">
      <button id="tab-scene" class="tab-btn active" data-tab="scene">Fondo completo</button>
      <button id="tab-souvenir" class="tab-btn" data-tab="souvenir">Recuerdo</button>
    </div>
    <div class="wallpaper-frame">
      <img id="wallpaper-preview" class="wallpaper-preview" alt="Pablo y Uma rodeados de flores">
    </div>
    <div class="menu-buttons row">
      <button id="download-btn" class="menu-btn primary">Descargar fondo</button>
      <button id="replay-btn" class="menu-btn">Volver a jugar</button>
    </div>
    <button id="credits-btn" class="menu-btn ghost">Ver más</button>
  </div>

  <!-- Post-creditos: la carta, con scroll estilo cine -->
  <div id="credits-screen" class="screen hidden">
    <div class="credits-viewport" id="credits-viewport">
      <div class="credits-content" id="credits-content"></div>
    </div>
    <button id="credits-skip" class="menu-btn ghost credits-skip">Volver</button>
  </div>

  <canvas id="wallpaper-canvas" width="1920" height="1080" class="hidden"></canvas>
  <canvas id="souvenir-canvas" width="1080" height="1920" class="hidden"></canvas>
  <canvas id="og-canvas" width="1200" height="630" class="hidden"></canvas>

  <!-- fundido entre pantallas -->
  <div id="fade-overlay" class="fade-overlay" aria-hidden="true"></div>

  <audio id="music-map" src="assets/audio/cancion_nes_instrumental.ogg" loop preload="auto"></audio>
  <audio id="music-flowers" src="assets/audio/flores_amarillas.ogg" loop preload="auto"></audio>
  <audio id="music-credits" src="assets/audio/cancion_nes_instrumental.ogg" loop preload="auto"></audio>

  <script src="js/main.js"></script>
</body>
</html>
